[package]
name = "retenixa"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
publish = false
description = "面向多客户端与多工作树的可靠任务接续 MCP"

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.1", features = ["v4"] }
serde_jcs = "=0.2.0"
jieba-rs = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
