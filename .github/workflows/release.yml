name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p "require('./adapters/dsh/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $GITHUB_REF_NAME must match the stable DSH adapter version ($version)." >&2
            exit 1
          fi

      - name: Test Rust core
        run: cargo test --release --locked --target x86_64-pc-windows-msvc
      - name: Build Rust core
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows core
        shell: pwsh
        run: |
          $binary = 'target/x86_64-pc-windows-msvc/release/retenixa.exe'
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^retenixa (\S+)$') {
            throw "Could not read the Retenixa core version: $version"
          }
          $coreVersion = $Matches[1]
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path $binary, LICENSE -DestinationPath "artifacts/retenixa-core-$coreVersion-windows-x64.zip"
      - name: Pack DSH adapter
        run: npm pack ./adapters/dsh --ignore-scripts --pack-destination artifacts
      - name: Share release assets
        id: artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Publish adapter to npm
        run: npm publish "./artifacts/retenixa-dsh-adapter-${GITHUB_REF_NAME#v}.tgz" --access public --ignore-scripts

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip "artifacts/retenixa-dsh-adapter-${GITHUB_REF_NAME#v}.tgz" \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
